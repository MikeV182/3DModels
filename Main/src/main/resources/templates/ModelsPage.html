<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>3DModels</title>
        <link rel="stylesheet" href="../static/ModelsPageStyle.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap" rel="stylesheet">
        <script src="../static/ModelsPageApp.js" defer></script>
    </head>

    <body>
        <!-- 
        <span>All models:</span>
        <p th:if="${models.empty}">
            <span>No models in here</span>
        </p>
        <p th:each="model : ${models}">
            <a th:href="@{/models/{id}(id=${model.id})}" th:text="${model.name}">user</a>
        </p>
        <hr/> 
        -->
        <div class="container" id="pageContainer">
            <div class="row align-items-center" id="pageHeader">
                <div class="col-1 d-flex align-items-center justify-content-center">
                    <img 
                        src="../static/img/logo_demo.png"
                        id="logo" 
                        alt=""
                    >
                </div>
                <div class="col-5 d-flex align-items-center justify-content-center">
                    <form action="/" class="input-group">
                        <input id="searchbar" type="search" class="form-control" placeholder="Search in more than two thousand 3D models"/>
                        <button id="searchButton" type="submit">
                            <img 
                                src="../static/img/search_icon.svg" 
                                alt=""
                                id="searchIcon">
                        </button>
                    </form>
                </div>
                <div class="col-1 text-center">
                    <a class="page-ref" href="/">Home</a>
                </div>
                <div class="col-1 text-center">
                    <a class="page-ref" href="/contacts">Contacts</a>
                </div>
                <div class="col-1 text-center">
                    <a class="page-ref" href="/help">Help</a>
                </div>
                <div class="col-1">
                    <!-- To add space between the elements -->
                </div>
                <div class="col-1 d-flex align-items-center justify-content-center">
                    <img 
                    src="../static/img/shopping_cart.svg" 
                    alt="" 
                    id="shoppingCart" />
                </div>
                <div class="col-1 d-flex align-items-center justify-content-center" sec:authorize="isAnonymous()">
                    <a class="sign-up-button d-flex align-items-center justify-content-center" href="/new">Sign Up</a>
                </div>
                <!-- 
                <div class="col-1 d-flex align-items-center justify-content-center" sec:authorize="isAuthenticated()">
                    <a class="sign-up-button d-flex align-items-center justify-content-center" href="/account">Account</a>
                </div> 
                -->
            </div>
        </div>
    </body>
</html>
